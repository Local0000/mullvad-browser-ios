name: Build Mullvad Browser

on:
workflow_dispatch:

jobs:
build:
runs-on: macos-15

steps:
  - name: Check out source
    uses: actions/checkout@v4
  - name: Check Xcode
    run: xcodebuild -version
  - name: Set up Ruby
    uses: ruby/setup-ruby@v1
    with:
      ruby-version: '3.2'
  - name: Install CocoaPods
    run: gem install cocoapods
  - name: Install dependencies
    run: pod install
  - name: List available schemes
    run: |
      xcodebuild -list \
        -workspace MullvadBrowser.xcworkspace
