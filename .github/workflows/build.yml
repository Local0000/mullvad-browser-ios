
name: Build Mullvad Browser

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Install dependencies
        run: pod install

      - name: Build iPhone app
        run: |
          xcodebuild \
            -workspace MullvadBrowser.xcworkspace \
            -scheme MullvadBrowser \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MullvadBrowser-iOS-unsigned
          path: build/DerivedData/Build/Products/Debug-iphoneos/MullvadBrowser.app
          if-no-files-found: error
          retention-days: 7
